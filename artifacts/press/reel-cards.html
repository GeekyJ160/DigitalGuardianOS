<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GuardianOS reel cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: transparent; }
      .card {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        font-family: "IBM Plex Sans", sans-serif;
        color: #ecece8;
      }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(10,11,13,.35) 0%, rgba(10,11,13,.55) 40%, rgba(10,11,13,.92) 100%);
      }
      .inner {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 120px 80px 110px;
        display: flex;
        flex-direction: column;
      }
      .kicker {
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #c45c26;
        font-size: 22px;
        font-weight: 500;
      }
      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        margin-top: 22px;
      }
      .sub {
        margin-top: 28px;
        font-size: 32px;
        color: #9a9aa3;
        line-height: 1.4;
        max-width: 16ch;
      }
      .grow { flex: 1; }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 20px;
        color: #c8ccd4;
      }
      .lower {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: transparent;
      }
      .bar {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 140px;
      }
      .bar .kicker { font-size: 18px; }
      .bar h2 {
        font-family: "Newsreader", Georgia, serif;
        font-size: 48px;
        font-weight: 500;
        margin-top: 10px;
        line-height: 1.15;
      }
    </style>
  </head>
  <body>
    <section class="card" id="open">
      <img class="bg" src="img/capsule-vert.jpg" alt="" />
      <div class="veil"></div>
      <div class="inner">
        <div class="brand">
          <svg width="40" height="40" viewBox="0 0 32 32">
            <rect x="10" y="3" width="12" height="26" rx="6" fill="none" stroke="#c8ccd4" stroke-width="1.5" />
            <circle cx="16" cy="16" r="2.2" fill="#c45c26" />
          </svg>
          GuardianOS
        </div>
        <div class="grow"></div>
        <p class="kicker">The black box for your real life</p>
        <h1>Stay protected. Preserve the truth.</h1>
        <p class="sub">Not another SOS button.</p>
      </div>
    </section>

    <section class="card" id="close">
      <img class="bg" src="img/street-vert.jpg" alt="" />
      <div class="veil"></div>
      <div class="inner" style="text-align: center; align-items: center">
        <div class="brand">GuardianOS</div>
        <div class="grow"></div>
        <p class="kicker">Start a session</p>
        <h1 style="max-width: 10ch">Your circle. Your protocol.</h1>
        <p class="sub" style="max-width: 18ch">Observed events. Never a verdict.</p>
        <div class="grow"></div>
      </div>
    </section>

    <section class="lower" id="lt-protect">
      <div class="bar">
        <p class="kicker">Guardian Session</p>
        <h2>If I don’t check in, start my protocol.</h2>
      </div>
    </section>
  </body>
</html>
